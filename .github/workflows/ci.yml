name: matmuh-backend ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  backend-build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      OFFICIAL_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_OFFICIAL_BACKEND_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract Clean Version
        id: get_version
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=main-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/matmuh-backend:latest
            ghcr.io/${{ github.repository_owner }}/matmuh-backend:${{ steps.get_version.outputs.VERSION }}

      - name: Trigger Dokploy deploy
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"

      - name: Trigger Dokploy deploy (official site)
        if: env.OFFICIAL_DEPLOY_WEBHOOK != ''
        run: curl -fsSL -X POST "$OFFICIAL_DEPLOY_WEBHOOK"
